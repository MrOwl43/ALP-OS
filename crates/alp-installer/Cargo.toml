# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "alp-installer"
description = "Installer logic (library) and local web front end for the graphical installer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "alp-installer"
path = "src/main.rs"

[dependencies]
# Disk discovery (inspect::blockdev) and the pool types (RaidProfile, Protection).
alp-hw.workspace = true
# First-boot seed contract types and state paths (alp_core::firstboot, alp_core::state).
alp-core.workspace = true
# Reads lsblk's JSON (identities, partitions after repart).
serde_json.workspace = true
# Writes the first-boot seed (TOML, contract firstboot-seed.md).
toml.workspace = true

[lints]
workspace = true
