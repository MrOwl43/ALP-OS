# SPDX-License-Identifier: AGPL-3.0-or-later
# Exact Ubuntu 26.04 package versions of the image build, VM test and
# contract check tools.
# CI installs exactly these; 'just check' verifies the dev VM matches.
# Update deliberately, in its own PR, with a passing image build and VM tests.
# The Ubuntu archive keeps only the newest version of a package, so CI fails
# (safely) when one of these is superseded. Then: update the dev VM, run
# 'dpkg-query -W' for these packages, update this file, rebuild, run
# 'just test-vm' and 'just repro-check', and open a PR.
debian-archive-keyring=2025.1ubuntu1
dosfstools=4.2-1.2build1
erofs-utils=1.9.1-1
just=1.45.0-1
mkosi=26-3
mtools=4.0.49-1
ovmf=2025.11-3ubuntu7.3
python3-yaml=6.0.3-1build1
qemu-system-x86=1:10.2.1+ds-1ubuntu3.3
qemu-utils=1:10.2.1+ds-1ubuntu3.3
# QEMU monitor access for screendumps in T-UI-01 (tests/vm/run-vm.sh host hook).
socat=1.8.1.1-1ubuntu0.1
squashfs-tools=1:4.7.5-1
swtpm=0.10.1+ds-1ubuntu3
systemd=259.9-0ubuntu0.1
# Pinned with systemd: Ubuntu published 259.9 and every unpinned package of
# the systemd source mkosi pulls in conflicted (runs 39341892822, 39342742054).
systemd-boot-tools=259.9-0ubuntu0.1
systemd-boot-efi=259.9-0ubuntu0.1
systemd-container=259.9-0ubuntu0.1
libsystemd-shared=259.9-0ubuntu0.1
libsystemd0=259.9-0ubuntu0.1
libudev1=259.9-0ubuntu0.1
udev=259.9-0ubuntu0.1
systemd-repart=259.9-0ubuntu0.1
systemd-ukify=259.9-0ubuntu0.1
# The runner image ships systemd-sysv at the newest version; pinned so it
# cannot conflict with the pinned systemd again (run 40853097606).
systemd-sysv=259.9-0ubuntu0.1
util-linux=2.41.3-3ubuntu2.2
