# Installed-system disk layout (contract: docs/contracts/disk-layout.md).
# Dedicated data disk: one partition over the whole disk. The installer
# creates it on every data disk the user confirmed; after install,
# alp-storage uses the same definition for added or replacement disks.
# No Format=: LUKS2 and Btrfs are created only by alp-storage.
[Partition]
Type=linux-generic
Label=alp-data
