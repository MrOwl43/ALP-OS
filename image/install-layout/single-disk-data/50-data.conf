# Installed-system disk layout (contract: docs/contracts/disk-layout.md).
# 7. Data area on a single-disk machine: the rest of the disk. No Format=:
# LUKS2 and Btrfs are created only by alp-storage (spec Section 2 rule 6).
# linux-generic so systemd never tries to unlock or mount it at boot.
[Partition]
Type=linux-generic
Label=alp-data
