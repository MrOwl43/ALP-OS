# Installed-system disk layout (contract: docs/contracts/disk-layout.md).
# 7. index: the encrypted index (ADR 0011) on the system disk instead of the
# stick. Left empty here; alpd formats it LUKS2 + Btrfs when the user
# chooses the password on the first start (docs/plans/0.2.8-first-start.md).
# Secrets and settings only, so it stays small.
[Partition]
# ALP-OS's own type UUID (crates/alp-live/src/index.rs TYPE_UUID).
Type=a3e1c6b2-5b7e-4f0a-9c1d-6b2f0e8a4d11
Label=alp-index
SizeMinBytes=1G
SizeMaxBytes=1G
