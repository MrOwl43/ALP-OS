# Installed-system disk layout (contract: docs/contracts/disk-layout.md).
# 1. ESP: systemd-boot and up to two UKIs (InstancesMax=2). 1 GiB: owner
# decision, ADR 0005 (the spec's 512 MB will be updated).
[Partition]
Type=esp
Label=esp
Format=vfat
SizeMinBytes=1G
SizeMaxBytes=1G
