# Installed-system disk layout (contract: docs/contracts/disk-layout.md).
# 3. dm-verity hash partition for root slot 1: the running system's own,
# copied with its partition UUID (CopyBlocks=auto, as slot 1).
[Partition]
Type=root-verity
Label=alp-os_%A_verity
CopyBlocks=auto
SizeMinBytes=128M
SizeMaxBytes=128M
