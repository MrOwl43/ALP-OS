# Installed-system disk layout (contract: docs/contracts/disk-layout.md).
# 6. state: /var/lib/alp and the /etc overlay upper layer (block 3).
# linux-generic so systemd never auto-mounts it; mounted explicitly by label.
[Partition]
Type=linux-generic
Label=alp-state
Format=ext4
SizeMinBytes=2G
SizeMaxBytes=2G
