# Installed-system disk layout (contract: docs/contracts/disk-layout.md).
# 2. Root slot 1 (EROFS, written by systemd-sysupdate). Free slots are
# labelled _empty. 8 GiB (owner decision, ADR 0005).
[Partition]
Type=root
Label=_empty
SizeMinBytes=8G
SizeMaxBytes=8G
