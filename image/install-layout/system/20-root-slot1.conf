# Installed-system disk layout (contract: docs/contracts/disk-layout.md).
# 2. Root slot 1 (EROFS). At install it is filled with the running system's
# own root, block for block (CopyBlocks=auto: repart finds the partition
# behind / through dm-verity and keeps its partition UUID, which the start
# file looks for). Labelled with the running version (%A, IMAGE_VERSION).
# Free slots are labelled _empty. 8 GiB (owner decision, ADR 0005).
[Partition]
Type=root
Label=alp-os_%A
CopyBlocks=auto
SizeMinBytes=8G
SizeMaxBytes=8G
