# Read-only root filesystem (EROFS), protected by dm-verity (spec block 1).
# The A/B second slot is added in block 2.
[Partition]
Type=root
Format=erofs
CopyFiles=/
ExcludeFilesTarget=/boot/
ExcludeFilesTarget=/efi/
Verity=data
VerityMatchKey=root
Minimize=best
# zstd: the kernel reads it (CONFIG_EROFS_FS_ZIP_ZSTD=y, Debian 6.12) and it
# keeps Immich and the kiosk inside the system image budget (ADR 0009).
Compression=zstd
