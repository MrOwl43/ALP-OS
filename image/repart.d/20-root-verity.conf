# dm-verity hash tree for the root partition. mkosi puts its root hash on the
# UKI kernel command line, so a changed root fails to mount. This protects
# against corruption and offline changes to the root; it is not yet a guard
# against an attacker while the UKI is unsigned and Secure Boot is off
# (signing: block 1 step 8 / block 2; see ADR 0003).
[Partition]
Type=root-verity
Verity=hash
VerityMatchKey=root
Minimize=best
