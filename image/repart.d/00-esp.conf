# EFI System Partition: systemd-boot (from /efi) and the UKI only. 512 MB FAT32 (spec
# block 2). Debian's loose kernel files in /boot are not copied: the UKI
# carries kernel, initrd and command line.
[Partition]
Type=esp
Format=vfat
CopyFiles=/boot/EFI:/EFI
CopyFiles=/boot/loader:/loader
# Copied last, so its loader/loader.conf (image/extra/efi/loader/, with
# 'editor no') wins; T-BOOT-01 checks the result on the built ESP.
CopyFiles=/efi:/
SizeMinBytes=512M
SizeMaxBytes=512M
