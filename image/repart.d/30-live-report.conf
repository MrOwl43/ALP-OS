# ALP-OS Live: small FAT partition that holds hardware reports (ADR 0007).
# "Microsoft basic data" type so Windows gives it a drive letter and the
# tester can open the report; Linux mounts it only on request (alpctl live).
[Partition]
Type=ebd0a0a2-b9e5-4433-87c0-68b6b72699c7
Label=ALP-REPORT
Format=vfat
SizeMinBytes=64M
SizeMaxBytes=64M
