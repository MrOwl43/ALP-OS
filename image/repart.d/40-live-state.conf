# ALP-OS Live: Live's own state on the stick (archive key file and record,
# remembered settings). ext4, made at build time, mounted at /var/lib/alp by
# alpctl (found by partition UUID on the stick only). ADR 0009.
[Partition]
Type=linux-generic
Label=alp-state
Format=ext4
SizeMinBytes=256M
SizeMaxBytes=256M
