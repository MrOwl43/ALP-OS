# Stream A: the Terminal (Live UI stage F, docs/plans/live-terminal.md,
# security review T1-T6, ADR 0021). ttyd (upstream's static
# 1.7.7 release, checksum-pinned in terminal/ttyd.lock and staged by `just
# build-image`: Debian trixie has no ttyd package) serves one text session on
# http://127.0.0.1:8413 as the unprivileged user alp-term
# (units/alp-terminal.service), started by alpd only after a password
# check. The rest is in extra/: the user (sysusers.d/alp-term.conf), the
# shell (usr/lib/alp/alp-term-*), and the firewall rule that cuts alp-term
# off from every local service (etc/nftables.conf, output chain).
# Nothing to install: the shell is bash and logger (bsdutils), both
# essential, and curl is in a-live.conf.
[Content]
# Security review R1 (2026-11-04): xwayland comes in as a dependency of the
# kiosk's packages, and cage (0.2.0, no option to turn it off) then opens an
# X server socket, also as the abstract @/tmp/.X11-unix/X0, which the
# Terminal's sandbox cannot hide; an X client could draw over the kiosk.
# Without the binary, wlroots creates no X server (it checks for it first)
# and cage carries on without one. Chromium runs as a Wayland client.
RemoveFiles=/usr/bin/Xwayland
