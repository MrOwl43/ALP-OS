# SPDX-License-Identifier: AGPL-3.0-or-later
# Stream A: the kiosk on the computer's own screen (ADR 0010): cage (Wayland
# kiosk compositor) + Chromium in kiosk mode on http://127.0.0.1:8411, locked
# by managed policies (docs/security/kiosk-lockdown.md).
[Content]
Packages=
        cage
        # Screen modes from the settings (T56): alpd lists and sets them through
        # cage's wlr-output-management (cage >= 0.1.5), as the kiosk user.
        # Debian stable (trixie) has 0.4.1-1 (tracker.debian.org, 2026-11-08);
        # cage has the protocol since 0.1.5 (its release notes). alpd reads the
        # plain listing, so no --json is needed.
        wlr-randr
        chromium
        # Software rendering when there is no working GPU (VMs, odd chips).
        libgl1-mesa-dri
        libegl-mesa0
        # pam_systemd: the kiosk user gets a logind session on seat0, so
        # cage may open the screen and input devices without root.
        libpam-systemd
        # Fonts for the UI (UX request; Noto covers most scripts).
        fonts-noto-core
        fonts-dejavu-core
        # Graphics firmware for the KMS drivers (non-free-firmware, ADR 0008
        # and 0010): Intel, AMD, NVIDIA (nouveau).
        firmware-intel-graphics
        firmware-amd-graphics
        firmware-nvidia-graphics
