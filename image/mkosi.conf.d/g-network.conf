# Stream G (minimal, for ALP-OS Live): wired and Wi-Fi network by DHCP,
# time sync, and an nftables firewall that drops unrequested incoming
# traffic (spec block 9). systemd-networkd ships in the systemd package.
[Distribution]
# Wi-Fi firmware is in Debian's non-free-firmware section (owner decision
# 2026-10-18: Wi-Fi is a compatibility requirement; ADR 0008).
Repositories=non-free-firmware

[Content]
Packages=
        systemd-timesyncd
        nftables
        # `ip` for the Live screen's address line and for diagnostics.
        iproute2
        # Wi-Fi: iwd joins the network (networkd does DHCP), the regulatory
        # database sets legal channels, firmware for common laptop chips.
        iwd
        wireless-regdb
        firmware-iwlwifi
        firmware-realtek
        firmware-mediatek
        firmware-atheros
        firmware-brcm80211
