# Stream A: the maintenance login and the encrypted index (ADR 0011,
# docs/security/admin-account.md).
[Content]
Packages=
        # pam_pwdfile: the admin password hash lives on the stick.
        libpam-pwdfile
        # mkpasswd: yescrypt hash of the password chosen at first start.
        whois
        # Root actions for the admin (sudoers.d/alp-admin).
        sudo
        # systemd-repart adds the index partition on the stick.
        systemd-repart
