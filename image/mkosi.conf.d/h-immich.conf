# Immich v3.3.3 inside the signed system image (ADR 0015,
# docs/plans/live-immich.md plan A): rootless Podman with Quadlet units
# (image/extra/etc/containers), the pinned images in a read-only image store
# at /usr/lib/alp/immich-images (image/immich/import.postinst), nginx with TLS
# in front (image/extra/etc/nginx). Machine learning is not shipped.
# Versions: Debian trixie snapshot (image/mkosi.conf); podman 5.4.2,
# crun 1.21, conmon 2.1.12, netavark/aardvark-dns 1.14.0, passt 2025-05-03,
# uidmap 4.17.4, catatonit 0.2.1, nginx 1.26.3 (docs/components.md).
[Content]
Packages=
        podman
        crun
        conmon
        netavark
        aardvark-dns
        # pasta: the pod's rootless network (immich.pod Network=pasta).
        passt
        # newuidmap/newgidmap (setuid) for the immich user's ID range.
        uidmap
        # The pod's init process (infra container).
        catatonit
        # The immich user's own D-Bus, which rootless podman uses for its
        # systemd cgroups under user@50000.service.
        dbus-user-session
        nginx
        # The per-device certificate (image/extra/usr/lib/alp/alp-live-tls).
        openssl
# Imports the images that `just _stage` (image/immich/fetch.sh) placed in
# image/immich-images. ALP_IMMICH_IMPORT=0 on the host skips the import
# (local builds without the images; Immich then cannot start).
PostInstallationScripts=immich/import.postinst
Environment=ALP_IMMICH_IMPORT
