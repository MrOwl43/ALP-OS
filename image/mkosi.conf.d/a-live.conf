# SPDX-License-Identifier: AGPL-3.0-or-later
# Stream A: ALP-OS Live hardware-test image (ADR 0006, ADR 0007).
[Content]
# blockdev and mount for alpctl live (util-linux is also pulled in by
# systemd; listed because alpctl calls it directly).
Packages=
        util-linux
        # Encrypted archive (ADR 0009): LUKS2 and Btrfs tools.
        cryptsetup-bin
        btrfs-progs
        # TPM2 auto-unlock of the index (ADR 0012): systemd-cryptenroll and
        # cryptsetup's systemd-tpm2 token plugin; libsystemd-shared loads
        # the tpm2-tss libraries at run time (dlopen), so they are listed.
        systemd-cryptsetup
        libtss2-esys-3.0.2-0t64
        libtss2-rc0t64
        libtss2-mu-4.0.1-0t64
        libtss2-tcti-device0t64
        # Loopback HTTP checks in VM tests and for diagnostics (alpd, Immich).
        curl
        # Storage v2 (ADR 0014; Debian trixie versions in its Evidence):
        # the encrypted archive folder (gocryptfs, FUSE 3; alpd mounts it as
        # root, so allow_other needs no user_allow_other in /etc/fuse.conf),
        # repair of dirty exFAT/NTFS (fsck.exfat, ntfsfix) and mkfs.exfat
        # for "Prepare this disk", the SMART health check, sfdisk.
        gocryptfs
        fuse3
        exfatprogs
        ntfs-3g
        smartmontools
        fdisk
        # The disk manager (T58): mkfs.ext4 for the ext4 format choice and
        # e2fsck -n for the read-only disk check (T-LIVE-05 found mkfs.ext4
        # missing).
        e2fsprogs
# Graphics drivers load (no nomodeset any more): the kiosk needs KMS
# (ADR 0010); the text screen stays as the fallback. TER16x32 is the
# kernel's built-in large console font (CONFIG_FONT_TER16x32=y in Debian's
# 6.12 kernel), readable on high-resolution laptop screens.
# No generated gettys (T38): console=ttyS0 (for the VM tests' serial log)
# made systemd start a login on ttyS0, which a laptop without a serial port
# restarted every 10 s with an I/O error. The admin login stays on tty2
# (explicit getty@tty2, docs/security/admin-account.md).
KernelCommandLine=fbcon=font:TER16x32 systemd.getty_auto=0
# Never touch the computer's own disks or TPM (ported from PR #7): root is
# the dm-verity device by name; no automatic partition discovery (also in
# the initrd), no swap, no resume from another system's hibernation image;
# the TPM setup services (which would store a key in the TPM) are masked:
# the index's TPM key slot (ADR 0012) needs no persistent SRK, and nothing
# but alpd's explicit enrolment may touch the chip.
KernelCommandLine=root=/dev/mapper/root systemd.gpt_auto=0 rd.systemd.gpt_auto=0 systemd.swap=0 noresume
KernelCommandLine=rd.systemd.mask=systemd-tpm2-setup-early.service systemd.mask=systemd-tpm2-setup-early.service systemd.mask=systemd-tpm2-setup.service
# alpctl (static musl build, ADR 0007) and the hardware profile, staged by
# `just build-image` into target/alp-image-tree.
ExtraTrees=%D/../target/alp-image-tree:/
