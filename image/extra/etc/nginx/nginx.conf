# SPDX-License-Identifier: AGPL-3.0-or-later
# ALP-OS Live alpha: the only listener on the home network. HTTPS on 443 in
# front of Immich (127.0.0.1:2283) for the phone app, and on port 80 only
# the certificate page (the device's CA certificate and install steps; no
# Immich, nothing else). Replaces Debian's nginx.conf completely: no
# sites-enabled, no dynamic modules. Runs only while Immich runs (ADR 0015,
# nginx.service.d/50-alp-live.conf). Design: docs/security/nginx-live.md.
#
# Delete guard (docs/plans/live-immich.md section 7): deleting on the phone
# never deletes on the server. Every DELETE is refused except two
# housekeeping routes, and admin, trash, job and library routes are refused
# for every method. Immich API v3.3.3 (open-api/immich-openapi-specs.json).

user www-data;
worker_processes 1;
pid /run/nginx.pid;
# A revoked phone's open connections (WebSocket too) end within seconds of
# the reload that revokes it (ADR 0017 §4).
worker_shutdown_timeout 10s;
# Before the config is read nginx logs to stderr (Debian build flag), which
# systemd sends to the journal; keep it there.
error_log stderr warn;

events {
    worker_connections 512;
}

http {
    server_tokens off;
    default_type application/octet-stream;
    types { }
    gzip off;

    # /var is a tmpfs (RAM) on Live and /var/lib/nginx does not exist there:
    # every temp path nginx creates at start-up lives directly in /run.
    # Request bodies are streamed, never spooled (proxy_request_buffering
    # off; proxy_max_temp_file_size 0), so these stay empty.
    client_body_temp_path /run/nginx-body;
    proxy_temp_path /run/nginx-proxy;
    fastcgi_temp_path /run/nginx-fastcgi;
    uwsgi_temp_path /run/nginx-uwsgi;
    scgi_temp_path /run/nginx-scgi;

    # Log only failures (4xx/5xx) to the journal, without query strings
    # (shared-link keys travel there) and never headers or bodies (tokens,
    # passwords).
    log_format alp '$remote_addr "$request_method $uri" $status $body_bytes_sent $request_time';
    map $status $alp_loggable {
        ~^[23] 0;
        default 1;
    }
    access_log syslog:server=unix:/dev/log,tag=nginx,severity=info,nohostname alp if=$alp_loggable;

    # 1 = refuse with 403. Matched on the normalised path ($uri: decoded,
    # slashes merged, dot segments resolved), case-insensitive because the
    # Immich server (Express) routes case-insensitively. First match wins.
    map "$request_method:$uri" $alp_deny {
        "~*^[A-Z]+:/api/(admin|system-config|system-metadata|jobs|queues|libraries|trash)(/|$)" 1;
        "~*^[A-Z]+:/api/auth/admin-sign-up(/|$)" 1;
        # Allowed DELETEs: sync checkpoints and ending a video stream
        # session. Neither removes a photo, video or album.
        "~*^DELETE:/api/sync/ack/?$" 0;
        "~*^DELETE:/api/assets/[^/]+/video/stream/[^/]+/?$" 0;
        "~*^DELETE:" 1;
        "~^(GET|HEAD|POST|PUT|PATCH|OPTIONS):" 0;
        default 1;
    }

    # T54 (review R6): while alpd reports the archive at risk (critical),
    # new photos are not taken: alpd writes /run/alp/critical-map.conf
    # (one line: "~." 1;) and reloads nginx; the file is gone otherwise.
    # Viewing, downloading and the rest of the API stay open, so photos can
    # still be copied off.
    map $host $alp_critical {
        default 0;
        include /run/alp/critical-map*.conf;
    }
    map "$alp_critical:$request_method:$uri" $alp_upload_paused {
        "~*^1:POST:/api/assets/?$" 1;
        "~*^1:PUT:/api/assets/[^/]+/original/?$" 1;
        default 0;
    }

    map $http_upgrade $alp_connection {
        default upgrade;
        "" close;
    }

    # Paired devices (ADR 0017): the allowlist of client certificate serials
    # written by alpd from its signed register; missing file = nobody.
    map $ssl_client_serial $alp_device_ok {
        default 0;
        include /run/alp/devices-map*.conf;
    }
    # Who may use the Immich API: a paired device always; a certificate that
    # is not (or no longer) on the list never; no certificate only in
    # compatibility mode (the official app with the installed CA, the 0.2.4
    # default). $alp_strict is set per server below.
    map "$ssl_client_verify:$alp_device_ok:$alp_strict" $alp_device_deny {
        "~^SUCCESS:1:" 0;
        "~^NONE:[01]:0$" 0;
        default 1;
    }

    # Slow or abusive clients from the home network.
    limit_conn_zone $binary_remote_addr zone=alp_perip:1m;
    limit_req_zone $binary_remote_addr zone=alp_login:1m rate=10r/m;
    # Pairing: a phone polls its status every few seconds for a few minutes.
    limit_req_zone $binary_remote_addr zone=alp_pair:1m rate=60r/m;

    server {
        listen 443 ssl;
        listen [::]:443 ssl ipv6only=on;
        server_name _;

        # Per-device certificate, signed by the device's own CA, in the
        # encrypted index; made on first use by /usr/lib/alp/alp-live-tls
        # (ADR 0015); key 0600 root.
        ssl_certificate /var/lib/alp-index/alp/tls/server.crt;
        ssl_certificate_key /var/lib/alp-index/alp/tls/server.key;
        ssl_protocols TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:alp_tls:1m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        # Phones may show a device certificate from the device's CA (ADR 0017).
        ssl_client_certificate /var/lib/alp-index/alp/tls/ca.crt;
        ssl_verify_client optional;
        ssl_verify_depth 1;
        # Strict unless alpd wrote the mode (fail closed: a missing file means
        # only paired devices; alpctl writes it before nginx starts).
        set $alp_strict 1;
        include /run/alp/pairing-mode*.conf;

        limit_conn alp_perip 64;

        # Large photo and video uploads (Immich's own nginx example):
        # stream the body to Immich, do not buffer it in RAM or on tmpfs.
        client_max_body_size 50000m;
        client_body_buffer_size 1m;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        client_header_timeout 60s;
        client_body_timeout 600s;
        send_timeout 600s;
        keepalive_timeout 75s;

        if ($alp_deny) {
            return 403;
        }

        # Every location below inherits these (none sets its own).
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Not $proxy_add_x_forwarded_for: a client must not choose the
        # address Immich sees (IMMICH_TRUSTED_PROXIES=127.0.0.1).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $alp_connection;
        # Method override headers could turn an allowed POST into a DELETE.
        proxy_set_header X-HTTP-Method-Override "";
        proxy_set_header X-HTTP-Method "";
        proxy_set_header X-Method-Override "";
        proxy_hide_header X-Powered-By;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        # Server discovery used by the mobile app.
        location = /.well-known/immich {
            proxy_pass http://127.0.0.1:2283;
        }

        location ~* ^/api/auth/login/?$ {
            if ($alp_device_deny) {
                return 403;
            }
            limit_req zone=alp_login burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://127.0.0.1:2283;
        }

        # The Immich API (and its websocket, /api/socket.io).
        location /api/ {
            if ($alp_device_deny) {
                return 403;
            }
            # 503: the phone app keeps the photo and tries again later.
            if ($alp_upload_paused) {
                return 503;
            }
            proxy_pass http://127.0.0.1:2283;
        }

        # The server's identity (ADR 0017): K_id, the CA and K_id's signed
        # endorsement of it, made by alp-live-tls. Public by design.
        location = /.well-known/alparchive/identity {
            limit_except GET { deny all; }
            default_type application/json;
            alias /run/alp/tls/identity.json;
        }
        # Pairing (ADR 0017): an unpaired phone with the QR's token; alpd
        # answers only these two calls here. Small bodies, rate limited.
        location ~ ^/alp/pair/v1/(request|status)$ {
            limit_except POST { deny all; }
            limit_req zone=alp_pair burst=20 nodelay;
            limit_req_status 429;
            client_max_body_size 8k;
            proxy_set_header Host 127.0.0.1:8411;
            proxy_set_header Origin "";
            proxy_pass http://127.0.0.1:8411/api/v1/live/pair/v1/$1;
        }
        # A phone browser opening the address sees that the certificate
        # works (T34), not a bare 404.
        location = / {
            limit_except GET { deny all; }
            default_type "text/html; charset=utf-8";
            root /usr/share/alp/immich/cert;
            try_files /ok.html =404;
        }
        # No web UI on the home network in the beta (ADR 0005 #7).
        location / {
            return 404;
        }
    }

    # The console's gallery (security review 2026-11-01, section 2): the
    # photo service's web pages for the kiosk only, on their own local
    # origin, so nothing in them can reach the console API. Loopback only
    # (nftables drops 8412 from the network and from the Terminal user).
    # The same delete guard as on 443. The browser holds no credential of
    # the photo service: for every API call nginx asks alpd (auth_request)
    # whether the console is signed in, and alpd answers with the family
    # account's key, which nginx adds. Locking the console closes the
    # gallery at once.
    server {
        listen 127.0.0.1:8412;
        server_name _;
        client_max_body_size 1m;

        if ($alp_deny) {
            return 403;
        }

        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_redirect off;
        proxy_set_header Host $host:8412;
        proxy_set_header X-Real-IP 127.0.0.1;
        proxy_set_header X-Forwarded-For 127.0.0.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $alp_connection;
        proxy_set_header X-HTTP-Method-Override "";
        proxy_set_header X-HTTP-Method "";
        proxy_set_header X-Method-Override "";
        # Only nginx's key signs in: nothing the page sends may choose
        # another account or session.
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header x-immich-user-token "";
        proxy_set_header x-immich-session-token "";
        proxy_set_header x-immich-share-key "";
        proxy_set_header x-immich-share-slug "";
        proxy_set_header x-api-key $alp_gallery_key;
        proxy_hide_header X-Powered-By;
        # The photo service's own session cookies are never used here.
        proxy_hide_header Set-Cookie;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        # alpd's answer: 2xx with the key while the console is signed in,
        # 401 otherwise. Only the console's cookie goes along; no browser
        # header that alpd refuses on this route (Sec-Fetch-Site, Origin).
        location = /_alp_gate {
            internal;
            proxy_pass http://127.0.0.1:8411/api/v1/live/gallery/gate;
            proxy_method GET;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host 127.0.0.1:8411;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Origin "";
            proxy_set_header Sec-Fetch-Site "";
            proxy_set_header x-api-key "";
        }

        # The console signs in and out, not the gallery page: its own
        # sign-in routes would only lead to a sign-in form in the frame.
        location ~* ^/api/auth/(login|logout|change-password|admin-sign-up)(/|$) {
            return 403;
        }

        location /api/ {
            auth_request /_alp_gate;
            auth_request_set $alp_gallery_key $upstream_http_x_alp_gallery_key;
            proxy_pass http://127.0.0.1:2283;
        }

        # The pages themselves (static files of the web gallery). The flag
        # cookie only tells the page to ask the API who is signed in; it is
        # not a credential.
        location / {
            set $alp_gallery_key "";
            add_header Set-Cookie "immich_is_authenticated=true; Path=/; SameSite=Strict" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
            proxy_pass http://127.0.0.1:2283;
        }
    }

    # The certificate page (plain HTTP: the phone does not trust the server
    # yet). The console shows its address as a QR code (phone/pair
    # certificate_url). Static files only; never proxied to Immich.
    server {
        listen 80;
        listen [::]:80 ipv6only=on;
        server_name _;
        limit_conn alp_perip 8;
        client_max_body_size 1k;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        location = / {
            limit_except GET { deny all; }
            default_type "text/html; charset=utf-8";
            root /usr/share/alp/immich/cert;
            try_files /index.html =404;
        }
        # The device's CA certificate, published by alp-live-tls.
        location = /alparchive.crt {
            limit_except GET { deny all; }
            default_type application/x-x509-ca-cert;
            add_header Content-Disposition 'attachment; filename="alparchive.crt"' always;
            add_header X-Content-Type-Options nosniff always;
            alias /run/alp/tls/alparchive.crt;
        }
        location / {
            return 404;
        }
    }
}
