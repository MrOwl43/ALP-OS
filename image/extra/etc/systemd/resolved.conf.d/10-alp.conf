# Name lookup for this computer's own outgoing requests (the time servers of
# systemd-timesyncd; alpha 0.2.6 field report: the clock was never set from
# the network because no name could be looked up). Only the loopback stub
# (127.0.0.53) listens; nothing is answered on the network: no LLMNR, no
# mDNS (the firewall drops both anyway).
[Resolve]
LLMNR=no
MulticastDNS=no
