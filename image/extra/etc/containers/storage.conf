# Container storage for ALP-OS Live (ADR 0015). Only the rootless `immich`
# user runs containers. Its writable store is the default rootless one,
# ~/.local/share/containers/storage, i.e. inside the encrypted index on the
# stick (the home is bind-mounted there), never on the tmpfs /var.
# The Immich images ship read-only inside the signed system image
# (/usr/lib/alp/immich-images, image/immich/import.postinst) and are loaded
# into that store by /usr/lib/alp/alp-immich-load: nothing is ever pulled
# from the network, and the images update and roll back with /usr.
[storage]
driver = "overlay"
runroot = "/run/containers/storage"
graphroot = "/var/lib/containers/storage"

[storage.options.overlay]
# Native kernel overlayfs (rootless since Linux 5.13); no fuse-overlayfs.
mountopt = "nodev"
