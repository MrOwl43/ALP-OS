# systemd-boot: no editing of the kernel command line at the boot menu, so
# the dm-verity roothash in the UKI cannot be removed there. (With Secure
# Boot off this is not a full protection; see ADR 0003.)
editor no
# The menu shows for 3 seconds, so "safe graphics" (image/mkosi.uki-profiles/)
# can be picked on older computers, and a computer that stops before the
# kernel starts shows at least this menu (field bug 0.2.7: blinking cursor).
# The first entry starts by itself. The installer copies this file to the
# installed ESP (crates/alp-installer/src/exec.rs).
timeout 3
