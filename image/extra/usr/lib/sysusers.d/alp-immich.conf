# The unprivileged user that runs Immich rootless (ADR 0015). Fixed IDs:
# its rootless podman store (in the index) maps them
# (container root = 50000, container uid n = 50000 + n, see /etc/subuid),
# and the archive's backing disk is mounted with uid=50000 (storage v2).
# Home /var/lib/immich is the index's immich folder, bind-mounted by
# `alpctl live immich prepare` only while the index is open.
g immich 50000
u immich 50000:50000 "ALPArchive photo service (Immich)" /var/lib/immich /usr/sbin/nologin
