# The Terminal's user (docs/plans/live-terminal.md, rule 1): no password,
# no login (access.conf allows only admin on tty2), no sudo, in no group
# but its own. Fixed ID 58413: the firewall rule in /etc/nftables.conf
# names it by number, so the rule loads even before this user exists. It
# is outside the IDs that Immich's containers map (/etc/subuid:
# 50000-55096).
g alp-term 58413
u alp-term 58413:58413 "ALPArchive Terminal" /nonexistent /usr/sbin/nologin
