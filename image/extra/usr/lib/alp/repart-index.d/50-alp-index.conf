# The encrypted index on the ALP-OS stick (ADR 0011). Not used at boot:
# alpd runs `systemd-repart --definitions=/usr/lib/alp/repart-index.d
# /dev/<the boot stick>` once, when the user chooses the password. The
# partition takes the stick's free space; alpd formats it (LUKS2 + Btrfs).
# Existing partitions match no definition here and are left as they are.
[Partition]
# ALP-OS's own type UUID (crates/alp-live/src/index.rs TYPE_UUID).
Type=a3e1c6b2-5b7e-4f0a-9c1d-6b2f0e8a4d11
Label=alp-index
SizeMinBytes=2G
