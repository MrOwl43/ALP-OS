# Where systemd-sysupdate puts the start files (UKIs) of new versions: the
# ESP (512 MiB) holds only the one the stick was written with (about
# 250 MiB), so two more do not fit there. systemd-boot reads this partition
# by its type (Boot Loader Specification, XBOOTLDR). Mounted only while an
# update is written or a start is marked good (alpctl live update).
[Partition]
Type=xbootldr
Label=alp-boot
Format=vfat
SizeMinBytes=1G
SizeMaxBytes=1G
