# The stick's layout for a first start with room for updates (ADR 0026,
# docs/plans/live-update.md): used instead of repart-index.d on a stick of
# 28 GiB or more. Existing partitions are matched by type, in file order:
# this one is the root the stick was written with. Weight=0: never grown.
[Partition]
Type=root
Weight=0
