# ALP-OS Live: remembered Wi-Fi networks live on the stick's state partition
# (bind-mounted to /var/lib/iwd by `alpctl live archive state-mount`).
[Unit]
After=alp-live-state.service

[Service]
# WPA3 switch-off for a Wi-Fi driver that does not finish WPA3 sign-in
# (alpd writes it after a join only worked with WPA2; wifi.rs IWD_QUIRKS).
# It sits on the stick next to the remembered networks, so it lasts across
# restarts; the image's /etc/iwd/main.conf is the mount point and is used
# when the file is not there ("-": a missing source is skipped).
BindReadOnlyPaths=-/var/lib/iwd/.alp-main.conf:/etc/iwd/main.conf
