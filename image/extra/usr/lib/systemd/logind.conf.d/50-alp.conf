# An archive server never goes to sleep by itself (0.2.7 laptop test,
# 2026-11-24: closing the lid suspended the computer for three hours and
# every phone upload stopped). The lid, the sleep keys and idle time do
# nothing; the power key still switches off cleanly.
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
IdleAction=ignore
