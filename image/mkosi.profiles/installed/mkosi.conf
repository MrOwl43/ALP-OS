# SPDX-License-Identifier: AGPL-3.0-or-later
# ALP-OS installed version (0.2.8, ADR 0028): starts from the USB stick,
# installs itself to a local disk or keeps running from the stick. The
# native screen (alp-screen, GTK 4 / libadwaita under cage) replaces the
# Chromium kiosk, and the computer's disks are not made read-only (the
# installer must write to the disks the user confirms; it refuses any
# other, crates/alp-installer).
[Content]
Packages=
        # cage runs only alp-screen (alp-screen.service).
        cage
        # alp-screen's libraries, the versions tools/build-screen.sh builds
        # against (snapshot in image/mkosi.conf; ADR 0028: GTK 4.18.6,
        # libadwaita 1.7.6).
        libgtk-4-1
        libadwaita-1-0
        # Software rendering when no GPU driver loads; screen session.
        libgl1-mesa-dri
        libegl-mesa0
        libpam-systemd
        fonts-noto-core
        fonts-dejavu-core
        firmware-intel-graphics
        firmware-amd-graphics
        firmware-nvidia-graphics
        # The installer partitions with systemd-repart (in a-admin.conf) and
        # installs the boot loader with bootctl (systemd-boot, mkosi.conf).
# alp-screen.service, and the Live units masked (symlinks to /dev/null):
# the Chromium kiosk and the disk protection.
ExtraTrees=extra:/
# alp-screen (tools/build-screen.sh) and alp-installer, staged by
# `ALP_PROFILE=installed just build-image`.
ExtraTrees=%D/../target/alp-installed-tree:/
RemoveFiles=/etc/chromium
