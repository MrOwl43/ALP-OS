# A third boot menu entry (UKI profile): the same system, but the kernel
# prints only errors (loglevel=3) in a small console font, so the line that
# explains a stop stays on the screen next to the final message.
# Field report 0.2.81 (MacBookPro8,1, 2026-11-26): "No working init found"
# at 5.7 s, while the reason (most likely "Initramfs unpacking failed",
# printed at emergency level) had scrolled off the screen.
[UKIProfile]
Profile=ID=errors-only
        TITLE=ALP-OS (show start errors only)
Cmdline=loglevel=3 fbcon=font:VGA8x16
