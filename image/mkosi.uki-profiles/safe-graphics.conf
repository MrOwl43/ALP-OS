# A second boot menu entry in the same start file (UKI profile, systemd
# 257+): the same system with the graphics drivers kept from switching the
# screen mode (nomodeset). The screen then stays on the firmware's own
# framebuffer (simpledrm) and alp-screen draws in software (Mesa).
# Field bug 0.2.7: older laptops (a 13-inch MacBook A1278, an ASUS) stop at
# a blinking cursor; this entry rules out the graphics driver hand-over.
# mkosi picks this file up from mkosi.uki-profiles/ (mkosi(1), UKIProfile).
[UKIProfile]
Profile=ID=safe-graphics
        TITLE=ALP-OS (safe graphics, older computers)
Cmdline=nomodeset
