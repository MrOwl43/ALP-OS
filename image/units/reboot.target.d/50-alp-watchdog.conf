# ALP-OS Live (T15): a shutdown that hangs on a stop job is forced after
# 240 s instead of systemd's 30 minutes (power button: Immich 90 s +
# archive 60 s + index 60 s must fit before the force). The forced reboot still syncs and
# unmounts what it can. alpd closes Immich, the archive and the index
# itself before asking for the reboot (power/off). VERIFY on the Debian
# trixie systemd: upstream reboot.target sets JobTimeoutSec=30min and
# JobTimeoutAction=reboot-force.
[Unit]
JobTimeoutSec=240s
JobTimeoutAction=reboot-force
