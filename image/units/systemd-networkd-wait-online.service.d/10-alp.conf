# A computer with Wi-Fi only has no network until the user picks one on the
# screen, so the default wait (all links, 120 s) always ran out and held
# back everything ordered after network-online.target (field log, alpha
# 0.2.5-test1). One link is enough, and 30 s is enough for a cable.
[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-networkd-wait-online --any --timeout=30
