# The immich user's manager (the photo service's pod): stop within 75 s
# at shutdown (T15; upstream 120 s). Postgres has 40 s inside it.
# On the installed system /var is a disk: a linger file left by a power
# cut makes logind start this manager at boot, before the index (the
# user's home) and the archive are open; its Quadlet units would then skip
# and the gallery stay down (T-IMMICH-03, 2026-11-26). The manager waits
# for both; alp-immich.service starts it once they are open.
[Unit]
ConditionPathIsMountPoint=/var/lib/alp-index
ConditionPathIsMountPoint=/var/lib/alp-pool/files

[Service]
TimeoutStopSec=75s
