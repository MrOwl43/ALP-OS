# nginx serves the phone app (443) and the certificate page (80) only while
# Immich runs (ADR 0015): its certificate lives in the encrypted index. At
# boot (Debian enables nginx.service) the condition skips it; alp-immich.service
# starts it after `alpctl live immich prepare` made the certificate, and
# stopping Immich stops it.
[Unit]
ConditionPathExists=/var/lib/alp-index/alp/tls/server.crt
After=alp-immich.service
PartOf=alp-immich.service

[Service]
# The paired-device allowlist and the mode live in /run (lost at boot):
# written from the index's register before every start and reload (ADR 0017).
ExecStartPre=/usr/bin/alpctl live pair write-map
ExecReload=
ExecReload=/usr/bin/alpctl live pair write-map
ExecReload=/bin/kill -s HUP $MAINPID
Restart=on-failure
RestartSec=2
NoNewPrivileges=yes
MemoryMax=128M
