# Contract (docs/contracts/systemd-targets.md): a boot only counts as good
# when alp-healthy.target is reached. If it fails, boot-complete.target fails
# and systemd-bless-boot does not mark the slot good. The automatic reboot
# that lets boot counting fall back is stream A's (reboot-on-failure rule in
# systemd-targets.md, T-BOOT-02).
[Unit]
Requires=alp-healthy.target
After=alp-healthy.target
