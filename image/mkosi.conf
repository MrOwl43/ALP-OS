# ALP-OS image definition (spec block 1).
# First milestone: a minimal Debian Stable disk image with systemd-boot and a
# UKI that boots in QEMU/OVMF and reaches alp-healthy.target.
# Plan and remaining work: docs/plans/block-1.md.
# Versions verified in docs/adr/0001-base-platform.md.

[Config]
MinimumVersion=26

[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64
# All packages come from this snapshot.debian.org point in time so rebuilds
# are identical. Bump deliberately (`mkosi -C image latest-snapshot`), one
# reviewed change at a time, with SourceDateEpoch set to the same moment.
Snapshot=20261016T023245Z

[Output]
Format=disk
ImageId=alp-os
ManifestFormat=json
# Fixed seed: systemd-repart derives partition and filesystem UUIDs from it.
Seed=90a800f1-d79f-5797-90b7-402f67810020
# Disk layout: ESP + read-only EROFS root + dm-verity hash (repart.d/).
RepartDirectories=repart.d

[Content]
# Same moment as Snapshot= above (2026-10-16T02:32:45Z).
SourceDateEpoch=1792117965
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=unsigned
# systemd.firstboot=off: an appliance never waits for interactive questions;
# ALP-OS has its own first-boot flow (block 7).
# systemd.volatile=state: root stays read-only, /var is a tmpfs. Interim
# until the persistent state partition (block 3).
KernelCommandLine=console=ttyS0 systemd.firstboot=off systemd.volatile=state
Hostname=alparchive
Packages=
        linux-image-amd64
        systemd
        systemd-sysv
        systemd-boot
        systemd-boot-efi
        udev
        dbus
ExtraTrees=
        units:/usr/lib/systemd/system
        extra:/
# Build-time logs and caches that embed timestamps; they break reproducible
# builds and do not belong in the image (found by `just repro-check`).
RemoveFiles=
        /var/log/*.log
        /var/cache/ldconfig/aux-cache

[Runtime]
Firmware=uefi
Console=read-only
RAM=2G
CPUs=2
